name: update

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 min; GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
    inputs:
      bulletin:
        description: 'Radio bulletin: auto (workday mornings) or now (make one in this run)'
        type: choice
        options: [auto, now]
        default: auto
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund --omit=dev

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Clustering tests
        run: node scripts/test-cluster.mjs && node scripts/test-threads.mjs

      - name: Fetch, extract, cluster, encrypt
        env:
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build.mjs

      # Radio bulletin: workday mornings (06:30-07:40 Belgrade) or on demand from the app. Never fails the build.
      - name: Radio bulletin
        continue-on-error: true
        timeout-minutes: 25
        env:
          BULLETIN: ${{ github.event_name == 'workflow_dispatch' && inputs.bulletin || 'auto' }}
          SITE: dist
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: northeurope
        run: node scripts/bulletin.mjs

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: news-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Separate job: deploying in the same job as the upload races the artifact API ("Found 0 artifacts").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
