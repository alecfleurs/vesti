<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
  <title>Pametniji čitač vesti</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Theme before first paint (no light flash for dark-mode users).
    try {
      var p = JSON.parse(localStorage.getItem('vesti:prefs') || '{}');
      var dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
  <style>
    #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; text-align: center;
      background: radial-gradient(120% 80% at 50% 30%, #26262c 0%, #0d0d0f 70%); color: #f1f1f2;
      font-family: "Inter", system-ui, sans-serif; transition: opacity .35s ease, visibility .35s; }
    #splash.gone { opacity: 0; visibility: hidden; }
    #splash .sp-in { padding: 24px; transform: translateY(-4vh); }
    #splash .sp-logo { width: min(46vw, 220px); height: auto; display: block; margin: 0 auto 22px; }
    #splash h1 { font: 700 30px/1.1 "Inter Display", "Inter", system-ui, sans-serif; letter-spacing: -.03em; margin: 0 0 10px;
      animation: sp-up .5s .45s both ease-out; }
    #splash p { margin: 0; color: #a7a7ad; font-size: 15px; line-height: 1.45; animation: sp-up .5s .6s both ease-out; }
    #splash .sp-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); margin: 28px auto 0; overflow: hidden; }
    #splash .sp-bar i { display: block; width: 40%; height: 100%; background: #d93a3f; border-radius: 3px; animation: sp-load 1.1s infinite ease-in-out; }
    #splash .s-cards { animation: sp-left .55s both cubic-bezier(.2,.8,.2,1); }
    #splash .s-lines path { stroke-dasharray: 160; stroke-dashoffset: 160; animation: sp-draw .5s .3s forwards ease-out; }
    #splash .s-article { transform-origin: 385px 256px; animation: sp-pop .45s .55s both cubic-bezier(.2,.9,.3,1.3); }
    @keyframes sp-left { from { transform: translateX(-60px); opacity: 0; } }
    @keyframes sp-draw { to { stroke-dashoffset: 0; } }
    @keyframes sp-pop { from { transform: scale(.6); opacity: 0; } }
    @keyframes sp-up { from { transform: translateY(10px); opacity: 0; } }
    @keyframes sp-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; stroke-dashoffset: 0 !important; } }
  </style>

</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-in">
      <svg class="sp-logo" viewBox="0 0 512 512"><g class="s-lines" fill="none" stroke-linecap="round">
    <path d="M226 142 C 280 142, 270 236, 314 236" stroke="#d93a3f" stroke-width="10" opacity=".9"/>
    <path d="M226 256 C 270 256, 280 256, 314 256" stroke="#3b82f6" stroke-width="10" opacity=".9"/>
    <path d="M226 370 C 280 370, 270 276, 314 276" stroke="#2f9e55" stroke-width="10" opacity=".9"/>
  </g>
  <g class="s-cards">
    <rect x="46" y="106" width="180" height="72" rx="20" fill="#ffffff" opacity=".12"/>
    <circle cx="82" cy="142" r="13" fill="#d93a3f"/>
    <rect x="108" y="130" width="92" height="10" rx="5" fill="#ffffff" opacity=".55"/>
    <rect x="108" y="148" width="62" height="8" rx="4" fill="#ffffff" opacity=".3"/>

    <rect x="46" y="220" width="180" height="72" rx="20" fill="#ffffff" opacity=".12"/>
    <circle cx="82" cy="256" r="13" fill="#3b82f6"/>
    <rect x="108" y="244" width="92" height="10" rx="5" fill="#ffffff" opacity=".55"/>
    <rect x="108" y="262" width="62" height="8" rx="4" fill="#ffffff" opacity=".3"/>

    <rect x="46" y="334" width="180" height="72" rx="20" fill="#ffffff" opacity=".12"/>
    <circle cx="82" cy="370" r="13" fill="#2f9e55"/>
    <rect x="108" y="358" width="92" height="10" rx="5" fill="#ffffff" opacity=".55"/>
    <rect x="108" y="376" width="62" height="8" rx="4" fill="#ffffff" opacity=".3"/>
  </g>
  <g class="s-article">
    <rect x="300" y="128" width="170" height="256" rx="28" fill="#f4f4f2"/>
    <rect x="326" y="160" width="118" height="64" rx="12" fill="#d93a3f"/>
    <rect x="326" y="244" width="118" height="14" rx="7" fill="#121214"/>
    <rect x="326" y="270" width="96" height="14" rx="7" fill="#121214"/>
    <rect x="326" y="304" width="118" height="9" rx="4.5" fill="#121214" opacity=".35"/>
    <rect x="326" y="323" width="118" height="9" rx="4.5" fill="#121214" opacity=".35"/>
    <rect x="326" y="342" width="76" height="9" rx="4.5" fill="#121214" opacity=".35"/>
  </g></svg>
      <h1>Pametniji čitač vesti</h1>
      <p>Sve vesti na jednom mestu.<br>Bez reklama, bez duplikata.</p>
      <div class="sp-bar"><i></i></div>
    </div>
  </div>
  <div id="app" aria-live="polite"></div>
  <script src="app.js" defer></script>
  <!-- GoatCounter: cookie-free stats. The app reports its own events; the URL fragment (password) is never sent. -->
  <script data-goatcounter="https://vesti-alex.goatcounter.com/count"
          data-goatcounter-settings='{"no_onload": true}'
          async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
